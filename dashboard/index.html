<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GitHub Actions Control Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #0d1117;
      --surface:   #161b22;
      --surface2:  #21262d;
      --border:    #30363d;
      --text:      #e6edf3;
      --muted:     #8b949e;
      --green:     #3fb950;
      --green-dim: #0d2818;
      --red:       #f85149;
      --red-dim:   #2d0f0f;
      --blue:      #388bfd;
      --blue-dim:  #0d1f3c;
      --yellow:    #e3b341;
      --yellow-dim:#2d2200;
      --accent:    #58a6ff;
      --radius:    10px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    /* Header */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky; top: 0; z-index: 100;
    }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 700; }
    .logo-icon { width: 32px; height: 32px; background: linear-gradient(135deg, #388bfd, #58a6ff); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .pill { display: flex; align-items: center; gap: 6px; background: var(--surface2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 12px; color: var(--muted); }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.8)} }

    /* Layout */
    .layout { display: flex; flex: 1; min-height: calc(100vh - 58px); }
    .sidebar { width: 210px; background: var(--surface); border-right: 1px solid var(--border); padding: 16px 10px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; }
    .sl { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; padding: 10px 10px 4px; }
    .nav { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--muted); border: none; background: none; text-align: left; width: 100%; transition: all .12s; }
    .nav:hover { background: var(--surface2); color: var(--text); }
    .nav.active { background: var(--blue-dim); color: var(--accent); }
    .main { flex: 1; padding: 22px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; }

    /* Cards */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
    .ch { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .ct { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .cb { padding: 18px; }

    /* Stats */
    .stats { display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
    .sc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; }
    .sl2 { font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .sv { font-size: 26px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
    .sv.g { color: var(--green); } .sv.r { color: var(--red); } .sv.b { color: var(--blue); } .sv.m { color: var(--muted); }

    /* Buttons */
    .btn { display: inline-flex; align-items: center; gap: 7px; padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 500; cursor: pointer; border: none; transition: all .12s; font-family: 'Inter', sans-serif; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn-g  { background: var(--green);  color: #000; } .btn-g:hover:not(:disabled)  { filter: brightness(1.12); }
    .btn-r  { background: var(--red);    color: #fff; } .btn-r:hover:not(:disabled)  { filter: brightness(1.12); }
    .btn-b  { background: var(--blue);   color: #fff; } .btn-b:hover:not(:disabled)  { filter: brightness(1.12); }
    .btn-y  { background: var(--yellow); color: #000; } .btn-y:hover:not(:disabled)  { filter: brightness(1.1); }
    .btn-gh { background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
    .btn-gh:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }

    /* Table */
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { padding: 9px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; border-bottom: 1px solid var(--border); }
    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: var(--surface2); }
    td { padding: 11px 14px; vertical-align: middle; }
    .mono { font-family: 'JetBrains Mono', monospace; font-size: 12px; }

    /* Badges */
    .badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; }
    .bg  { background: var(--green-dim);  color: var(--green); }
    .br  { background: var(--red-dim);    color: var(--red); }
    .by  { background: var(--yellow-dim); color: var(--yellow); }
    .bb  { background: var(--blue-dim);   color: var(--blue); }
    .bm  { background: var(--surface2);   color: var(--muted); }
    .bd  { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
    .spin { animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Form */
    .fg { margin-bottom: 14px; }
    .fl { font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; display: block; }
    .fi {
      width: 100%; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px;
      padding: 8px 12px; color: var(--text); font-size: 13px; font-family: 'JetBrains Mono', monospace;
      outline: none; transition: border-color .12s;
    }
    .fi:focus { border-color: var(--accent); }
    .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .frow3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }

    /* Repos list in sidebar */
    .repo-tag {
      display: flex; align-items: center; gap: 6px;
      padding: 5px 10px; border-radius: 5px; font-size: 12px;
      color: var(--muted); cursor: pointer; background: none; border: none; width: 100%; text-align: left;
      transition: all .12s;
    }
    .repo-tag:hover { background: var(--surface2); color: var(--text); }
    .repo-tag.active { background: var(--blue-dim); color: var(--accent); }
    .repo-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }

    /* Modal */
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.75); z-index: 200; align-items: center; justify-content: center; }
    .overlay.show { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px; width: 520px; max-width: 95vw; }
    .modal h2 { font-size: 17px; margin-bottom: 18px; display: flex; align-items: center; gap: 8px; }

    /* Toast */
    #toast {
      position: fixed; bottom: 22px; right: 22px;
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      padding: 11px 16px; font-size: 13px; display: flex; align-items: center; gap: 9px;
      opacity: 0; transform: translateY(8px); transition: all .22s; z-index: 999; max-width: 300px;
    }
    #toast.show { opacity: 1; transform: translateY(0); }

    /* Spinner */
    .spinner { display: inline-block; width: 13px; height: 13px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite; }

    @media (max-width: 768px) {
      .sidebar { display: none; }
      .stats { grid-template-columns: 1fr 1fr; }
      .frow, .frow3 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    Actions Control
  </div>
  <div class="header-right">
    <div class="pill">
      <div class="dot"></div>
      <span id="refresh-label">Refreshing in 15s</span>
    </div>
    <button class="btn btn-gh" style="padding:6px 12px;font-size:12px" onclick="showAddRepo()">＋ Add Repo</button>
    <button class="btn btn-gh" style="padding:6px 12px;font-size:12px" onclick="showSettings()">⚙️</button>
  </div>
</header>

<div class="layout">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sl">Repos</div>
    <div id="repo-list"></div>
    <div style="margin-top:auto;padding-top:16px;border-top:1px solid var(--border);margin-top:16px">
      <button class="nav" onclick="showAddRepo()">＋ Add Repository</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <!-- Dashboard tab -->
    <div id="tab-dashboard">
      <div class="stats">
        <div class="sc"><div class="sl2">Active Runs</div><div class="sv g" id="st-active">—</div></div>
        <div class="sc"><div class="sl2">Total (last 20)</div><div class="sv b" id="st-total">—</div></div>
        <div class="sc"><div class="sl2">Success</div><div class="sv g" id="st-ok">—</div></div>
        <div class="sc"><div class="sl2">Failed / Cancelled</div><div class="sv r" id="st-bad">—</div></div>
      </div>

      <div class="card">
        <div class="ch"><div class="ct">⚡ Quick Actions</div><span id="current-repo-label" style="font-size:12px;color:var(--muted)"></span></div>
        <div class="cb">
          <div class="actions">
            <button class="btn btn-g" onclick="startRun()">▶ Start New Run</button>
            <button class="btn btn-r" onclick="stopAll()">■ Stop All</button>
            <button class="btn btn-y" onclick="restartAll()">↺ Restart</button>
            <button class="btn btn-gh" onclick="fetchRuns()">⟳ Refresh</button>
          </div>
        </div>
      </div>

      <div class="card">
        <div class="ch">
          <div class="ct">📋 Workflow Runs</div>
          <span id="updated-label" style="font-size:12px;color:var(--muted)"></span>
        </div>
        <div style="overflow-x:auto">
          <table>
            <thead><tr><th>Status</th><th>Run #</th><th>Workflow</th><th>Branch</th><th>Duration</th><th>Age</th><th>Action</th></tr></thead>
            <tbody id="tbody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Tokens tab -->
    <div id="tab-tokens" style="display:none">
      <div class="card">
        <div class="ch"><div class="ct">🔑 Token Management</div></div>
        <div class="cb">
          <div id="token-list"></div>
          <button class="btn btn-b" onclick="showAddToken()" style="margin-top:4px">＋ Add Token</button>
        </div>
      </div>
      <div class="card">
        <div class="ch"><div class="ct">📦 Repo Configurations</div></div>
        <div class="cb" id="repo-config-list"></div>
      </div>
    </div>
  </main>
</div>

<!-- Add/Edit Repo Modal -->
<div class="overlay" id="repo-modal">
  <div class="modal">
    <h2>📦 Add Repository</h2>
    <div class="frow">
      <div class="fg">
        <label class="fl">Repository (owner/repo)</label>
        <input class="fi" id="rm-repo" placeholder="safwasf/rdpv1"/>
      </div>
      <div class="fg">
        <label class="fl">Workflow File</label>
        <input class="fi" id="rm-workflow" placeholder="main.yml"/>
      </div>
    </div>
    <div class="frow">
      <div class="fg">
        <label class="fl">Branch</label>
        <input class="fi" id="rm-branch" placeholder="main"/>
      </div>
      <div class="fg">
        <label class="fl">GitHub Token (select saved)</label>
        <select class="fi" id="rm-token-select" style="font-family:Inter,sans-serif"></select>
      </div>
    </div>
    <div class="fg">
      <label class="fl">Label (display name)</label>
      <input class="fi" id="rm-label" placeholder="My RDP Runner"/>
    </div>
    <div style="display:flex;gap:10px;margin-top:6px">
      <button class="btn btn-b" onclick="saveRepo()" style="flex:1">Save</button>
      <button class="btn btn-gh" onclick="closeModal('repo-modal')">Cancel</button>
    </div>
  </div>
</div>

<!-- Add Token Modal -->
<div class="overlay" id="token-modal">
  <div class="modal">
    <h2>🔑 Add GitHub Token</h2>
    <div class="fg">
      <label class="fl">Token Name (label)</label>
      <input class="fi" id="tm-name" placeholder="My Main Account"/>
    </div>
    <div class="fg">
      <label class="fl">GitHub Personal Access Token</label>
      <input class="fi" id="tm-token" type="password" placeholder="ghp_..."/>
    </div>
    <div id="tm-verify" style="font-size:12px;margin-top:6px;min-height:20px"></div>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn btn-gh" onclick="verifyTmToken()">✓ Verify</button>
      <button class="btn btn-b" onclick="saveToken()" style="flex:1">Save Token</button>
      <button class="btn btn-gh" onclick="closeModal('token-modal')">Cancel</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="overlay" id="settings-modal">
  <div class="modal">
    <h2>⚙️ Settings</h2>
    <div class="fg">
      <label class="fl">Auto-refresh interval (seconds)</label>
      <input class="fi" id="set-interval" type="number" min="5" max="300" value="15"/>
    </div>
    <div style="display:flex;gap:10px;margin-top:10px">
      <button class="btn btn-b" onclick="saveSettings()" style="flex:1">Save</button>
      <button class="btn btn-r" onclick="clearAll()">Clear All Data</button>
      <button class="btn btn-gh" onclick="closeModal('settings-modal')">Cancel</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── State ────────────────────────────────────────────────────
let state = { tokens: {}, repos: [], activeRepo: null, settings: { interval: 15 } };
let refreshTimer = null;
let countdown = 15;

function loadState() {
  try { state = JSON.parse(localStorage.getItem('gha-dashboard') || '{}'); } catch(e) {}
  state.tokens   = state.tokens   || {};
  state.repos    = state.repos    || [];
  state.settings = state.settings || { interval: 15 };
  if (state.repos.length === 0) showAddRepo();
  else { state.activeRepo = state.activeRepo || state.repos[0].id; renderSidebar(); fetchRuns(); startTimer(); }
}

function saveState() { localStorage.setItem('gha-dashboard', JSON.stringify(state)); }

// ── Repos ────────────────────────────────────────────────────
function getRepo(id) { return state.repos.find(r => r.id === id); }
function getActiveRepo() { return getRepo(state.activeRepo); }
function selectRepo(id) { state.activeRepo = id; saveState(); renderSidebar(); fetchRuns(); }

function renderSidebar() {
  const list = document.getElementById('repo-list');
  list.innerHTML = state.repos.map(r => `
    <button class="repo-tag ${r.id === state.activeRepo ? 'active' : ''}" onclick="selectRepo('${r.id}')">
      <span class="repo-dot" style="background:${r.id === state.activeRepo ? 'var(--accent)' : 'var(--muted)'}"></span>
      ${r.label || r.repo}
    </button>
  `).join('');

  const repo = getActiveRepo();
  if (repo) {
    document.getElementById('current-repo-label').textContent = repo.repo + ' / ' + repo.workflow;
  }
}

function showAddRepo() {
  document.getElementById('rm-repo').value = '';
  document.getElementById('rm-workflow').value = 'main.yml';
  document.getElementById('rm-branch').value = 'main';
  document.getElementById('rm-label').value = '';
  populateTokenSelect('rm-token-select');
  document.getElementById('repo-modal').classList.add('show');
}

function saveRepo() {
  const repo = {
    id:       Date.now().toString(),
    repo:     document.getElementById('rm-repo').value.trim(),
    workflow: document.getElementById('rm-workflow').value.trim() || 'main.yml',
    branch:   document.getElementById('rm-branch').value.trim()  || 'main',
    label:    document.getElementById('rm-label').value.trim(),
    tokenId:  document.getElementById('rm-token-select').value,
  };
  if (!repo.repo) { toast('❌ Repo is required', 'r'); return; }
  if (!repo.tokenId) { toast('❌ Select a token (add one first)', 'r'); return; }
  state.repos.push(repo);
  state.activeRepo = repo.id;
  saveState();
  closeModal('repo-modal');
  renderSidebar();
  fetchRuns();
  startTimer();
  toast('✅ Repo added', 'g');
}

// ── Tokens ───────────────────────────────────────────────────
function populateTokenSelect(elId) {
  const sel = document.getElementById(elId);
  const keys = Object.keys(state.tokens);
  if (keys.length === 0) {
    sel.innerHTML = '<option value="">— No tokens saved. Add one first. —</option>';
  } else {
    sel.innerHTML = keys.map(k => `<option value="${k}">${state.tokens[k].name}</option>`).join('');
  }
}

function showAddToken() {
  document.getElementById('tm-name').value = '';
  document.getElementById('tm-token').value = '';
  document.getElementById('tm-verify').textContent = '';
  document.getElementById('token-modal').classList.add('show');
}

async function verifyTmToken() {
  const token = document.getElementById('tm-token').value.trim();
  if (!token) return;
  const el = document.getElementById('tm-verify');
  el.textContent = '⏳ Verifying...';
  try {
    const res = await fetch('https://api.github.com/user', { headers: { Authorization: `Bearer ${token}` } });
    const d = await res.json();
    if (res.ok) { el.innerHTML = `<span style="color:var(--green)">✅ Valid — ${d.login}</span>`; document.getElementById('tm-name').value = document.getElementById('tm-name').value || d.login; }
    else el.innerHTML = `<span style="color:var(--red)">❌ ${d.message}</span>`;
  } catch(e) { el.innerHTML = `<span style="color:var(--red)">❌ ${e.message}</span>`; }
}

function saveToken() {
  const id    = Date.now().toString();
  const name  = document.getElementById('tm-name').value.trim()  || 'Token ' + id;
  const token = document.getElementById('tm-token').value.trim();
  if (!token) { toast('❌ Token is required', 'r'); return; }
  state.tokens[id] = { name, token };
  saveState();
  closeModal('token-modal');
  renderTokenList();
  toast('✅ Token saved', 'g');
}

function renderTokenList() {
  const el = document.getElementById('token-list');
  const keys = Object.keys(state.tokens);
  if (keys.length === 0) { el.innerHTML = '<p style="color:var(--muted);font-size:13px;margin-bottom:14px">No tokens saved yet.</p>'; return; }
  el.innerHTML = keys.map(k => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:13px;font-weight:500">${state.tokens[k].name}</div>
        <div class="mono" style="font-size:11px;color:var(--muted);margin-top:2px">${state.tokens[k].token.slice(0,12)}••••••••</div>
      </div>
      <button class="btn btn-r" style="padding:4px 10px;font-size:11px" onclick="deleteToken('${k}')">Delete</button>
    </div>
  `).join('');
}

function deleteToken(id) {
  if (!confirm('Delete this token?')) return;
  delete state.tokens[id];
  saveState(); renderTokenList(); toast('🗑️ Token deleted', 'g');
}

function renderRepoConfigList() {
  const el = document.getElementById('repo-config-list');
  if (state.repos.length === 0) { el.innerHTML = '<p style="color:var(--muted);font-size:13px">No repos configured.</p>'; return; }
  el.innerHTML = state.repos.map(r => `
    <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border)">
      <div>
        <div style="font-size:13px;font-weight:500">${r.label || r.repo}</div>
        <div class="mono" style="font-size:11px;color:var(--muted);margin-top:2px">${r.repo} / ${r.workflow} @ ${r.branch}</div>
      </div>
      <button class="btn btn-r" style="padding:4px 10px;font-size:11px" onclick="deleteRepo('${r.id}')">Remove</button>
    </div>
  `).join('');
}

function deleteRepo(id) {
  if (!confirm('Remove this repo?')) return;
  state.repos = state.repos.filter(r => r.id !== id);
  if (state.activeRepo === id) state.activeRepo = state.repos[0]?.id || null;
  saveState(); renderSidebar(); renderRepoConfigList(); toast('🗑️ Repo removed', 'g');
}

// ── GitHub API ────────────────────────────────────────────────
const GH = 'https://api.github.com';
function hdrs(tokenId) {
  const tok = state.tokens[tokenId]?.token;
  return { 'Authorization': `Bearer ${tok}`, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
}

async function fetchRuns() {
  const repo = getActiveRepo();
  if (!repo) return;
  document.getElementById('tbody').innerHTML = '<tr><td colspan="7" style="text-align:center;padding:28px;color:var(--muted)"><div class="spinner"></div></td></tr>';
  try {
    const res = await fetch(`${GH}/repos/${repo.repo}/actions/workflows/${repo.workflow}/runs?per_page=20`, { headers: hdrs(repo.tokenId) });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    renderRuns(data.workflow_runs || []);
    updateStats(data.workflow_runs || []);
    document.getElementById('updated-label').textContent = 'Updated ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('tbody').innerHTML = `<tr><td colspan="7" style="text-align:center;padding:28px;color:var(--red)">${e.message}</td></tr>`;
    toast('❌ ' + e.message, 'r');
  }
}

function renderRuns(runs) {
  const repo = getActiveRepo();
  document.getElementById('tbody').innerHTML = runs.length === 0
    ? '<tr><td colspan="7" style="text-align:center;padding:28px;color:var(--muted)">No runs found</td></tr>'
    : runs.map(r => {
      const dur = r.run_started_at ? calcDur(r.run_started_at, r.updated_at) : '—';
      const canCancel = r.status === 'in_progress' || r.status === 'queued';
      return `<tr>
        <td>${badge(r.status, r.conclusion)}</td>
        <td class="mono">#${r.run_number}</td>
        <td style="color:var(--muted);font-size:12px">${r.name}</td>
        <td class="mono">${r.head_branch}</td>
        <td class="mono">${dur}</td>
        <td style="color:var(--muted);font-size:12px">${timeAgo(r.created_at)}</td>
        <td>${canCancel
          ? `<button class="btn btn-r" style="padding:3px 9px;font-size:11px" onclick="cancelRun('${r.id}')">Cancel</button>`
          : `<button class="btn btn-gh" style="padding:3px 9px;font-size:11px" onclick="rerunThis('${r.id}')">Re-run</button>`}</td>
      </tr>`;
    }).join('');
}

function badge(status, conclusion) {
  if (status==='in_progress') return `<span class="badge by"><span class="bd spin"></span>Running</span>`;
  if (status==='queued')      return `<span class="badge bb"><span class="bd"></span>Queued</span>`;
  if (conclusion==='success') return `<span class="badge bg"><span class="bd"></span>Success</span>`;
  if (conclusion==='cancelled') return `<span class="badge bm"><span class="bd"></span>Cancelled</span>`;
  return `<span class="badge br"><span class="bd"></span>${conclusion||status}</span>`;
}

function updateStats(runs) {
  document.getElementById('st-active').textContent = runs.filter(r=>r.status==='in_progress'||r.status==='queued').length;
  document.getElementById('st-total').textContent  = runs.length;
  document.getElementById('st-ok').textContent     = runs.filter(r=>r.conclusion==='success').length;
  document.getElementById('st-bad').textContent    = runs.filter(r=>r.conclusion==='failure'||r.conclusion==='cancelled').length;
}

async function startRun() {
  const repo = getActiveRepo();
  if (!repo) { toast('❌ No repo selected', 'r'); return; }
  try {
    const res = await fetch(`${GH}/repos/${repo.repo}/actions/workflows/${repo.workflow}/dispatches`, {
      method: 'POST', headers: { ...hdrs(repo.tokenId), 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: repo.branch })
    });
    if (res.status === 204) { toast('✅ New run started!', 'g'); setTimeout(fetchRuns, 2000); }
    else throw new Error(`HTTP ${res.status}`);
  } catch(e) { toast('❌ ' + e.message, 'r'); }
}

async function cancelRun(id) {
  const repo = getActiveRepo();
  try {
    await fetch(`${GH}/repos/${repo.repo}/actions/runs/${id}/cancel`, { method: 'POST', headers: hdrs(repo.tokenId) });
    toast('✅ Cancelled', 'g'); setTimeout(fetchRuns, 1500);
  } catch(e) { toast('❌ ' + e.message, 'r'); }
}

async function rerunThis(id) {
  const repo = getActiveRepo();
  try {
    await fetch(`${GH}/repos/${repo.repo}/actions/runs/${id}/rerun`, { method: 'POST', headers: hdrs(repo.tokenId) });
    toast('✅ Re-running...', 'g'); setTimeout(fetchRuns, 2000);
  } catch(e) { toast('❌ ' + e.message, 'r'); }
}

async function stopAll() {
  const repo = getActiveRepo();
  if (!confirm('Stop all running workflows?')) return;
  try {
    const [r1, r2] = await Promise.all([
      fetch(`${GH}/repos/${repo.repo}/actions/runs?status=in_progress&per_page=20`, { headers: hdrs(repo.tokenId) }),
      fetch(`${GH}/repos/${repo.repo}/actions/runs?status=queued&per_page=20`,      { headers: hdrs(repo.tokenId) }),
    ]);
    const [d1, d2] = await Promise.all([r1.json(), r2.json()]);
    const runs = [...(d1.workflow_runs||[]), ...(d2.workflow_runs||[])];
    await Promise.all(runs.map(r => cancelRun(r.id)));
    toast(`✅ Stopped ${runs.length} run(s)`, 'g');
  } catch(e) { toast('❌ ' + e.message, 'r'); }
}

async function restartAll() { await stopAll(); setTimeout(startRun, 3000); }

// ── Tabs ─────────────────────────────────────────────────────
function switchTab(name) {
  ['dashboard','tokens'].forEach(t => {
    const el = document.getElementById('tab-'+t);
    if (el) el.style.display = t===name ? 'flex' : 'none';
    if (el && t===name) el.style.flexDirection = 'column';
  });
  if (name === 'tokens') { renderTokenList(); renderRepoConfigList(); }
}

// ── Settings ─────────────────────────────────────────────────
function showSettings() {
  document.getElementById('set-interval').value = state.settings.interval || 15;
  document.getElementById('settings-modal').classList.add('show');
}
function saveSettings() {
  state.settings.interval = parseInt(document.getElementById('set-interval').value) || 15;
  saveState(); closeModal('settings-modal'); startTimer(); toast('✅ Settings saved', 'g');
}
function clearAll() {
  if (!confirm('Clear ALL data (tokens, repos, settings)?')) return;
  localStorage.removeItem('gha-dashboard'); location.reload();
}

// ── Timer ────────────────────────────────────────────────────
function startTimer() {
  if (refreshTimer) clearInterval(refreshTimer);
  countdown = state.settings.interval || 15;
  refreshTimer = setInterval(() => {
    countdown--;
    document.getElementById('refresh-label').textContent = `Refresh in ${countdown}s`;
    if (countdown <= 0) { countdown = state.settings.interval || 15; fetchRuns(); }
  }, 1000);
}

// ── Helpers ──────────────────────────────────────────────────
function calcDur(s, e) {
  const sec = Math.floor((new Date(e)-new Date(s))/1000);
  return sec < 60 ? sec+'s' : Math.floor(sec/60)+'m '+sec%60+'s';
}
function timeAgo(d) {
  const s = Math.floor((Date.now()-new Date(d))/1000);
  if (s<60) return s+'s ago';
  if (s<3600) return Math.floor(s/60)+'m ago';
  return Math.floor(s/3600)+'h ago';
}
function toast(msg, type='g') {
  const el = document.getElementById('toast');
  const c = type==='g'?'var(--green)':type==='r'?'var(--red)':'var(--accent)';
  el.innerHTML = `<span style="color:${c}">●</span> ${msg}`;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 3200);
}
function closeModal(id) { document.getElementById(id).classList.remove('show'); }

// Add nav buttons to sidebar dynamically (avoid duplication)
document.addEventListener('DOMContentLoaded', () => {
  // Add nav items
  const sidebar = document.querySelector('.sidebar');
  const navSection = document.createElement('div');
  navSection.innerHTML = `
    <div class="sl" style="margin-top:16px">Views</div>
    <button class="nav active" id="nav-dash" onclick="switchTab('dashboard');setActiveNav(this)">📊 Dashboard</button>
    <button class="nav" id="nav-tok" onclick="switchTab('tokens');setActiveNav(this)">🔑 Tokens & Repos</button>
  `;
  sidebar.insertBefore(navSection, sidebar.querySelector('[style*="margin-top:auto"]') || sidebar.lastChild);
  loadState();
});

function setActiveNav(btn) {
  document.querySelectorAll('.nav').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}
</script>
